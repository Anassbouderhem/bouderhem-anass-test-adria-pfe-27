spring.application.name=e-bank
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
server.port=8058
spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8082/mcp
spring.ai.mcp.client.streamable-http.connections.transaction.url=http://localhost:8081/mcp
telegram.token=${TELEGRAM_TOKEN}
eureka.client.jersey.enabled=false